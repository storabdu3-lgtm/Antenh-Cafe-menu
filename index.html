    <script>
      (function() {
        try {
          var g = typeof window !== 'undefined' ? window : typeof globalThis !== 'undefined' ? globalThis : self;
          if (!g) return;
          var activeFetch = g.fetch ? g.fetch.bind(g) : null;
          function installSafeFetch(target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || !desc.set || desc.writable === false) {
                Object.defineProperty(target, 'fetch', {
                  get: function() {
                    return activeFetch;
                  },
                  set: function(newFetch) {
                    activeFetch = newFetch;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (_) {}
          }
          if (typeof window !== 'undefined') {
            installSafeFetch(window);
            if (typeof Window !== 'undefined' && Window.prototype) {
              installSafeFetch(Window.prototype);
            }
          }
          if (typeof globalThis !== 'undefined') {
            installSafeFetch(globalThis);
          }
        } catch (e) {
          console.warn('Safe fetch init error:', e);
        }
      })();
    </script>
